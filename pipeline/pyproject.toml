[project]
name = "ieie-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27", "pymupdf>=1.24", "pdfplumber>=0.11", "rapidfuzz>=3.9", "pyyaml>=6",
  "supabase>=2.5", "anthropic>=0.40", "voyageai>=0.3", "typesense>=0.21", "boto3>=1.34",
  "pydantic>=2.7", "tenacity>=8.3", "python-dotenv>=1.0", "lxml>=5.2",
]
[project.optional-dependencies]
parse = ["docling>=2.0", "grobid-client-python>=0.0.8"]
ocr = ["pytesseract>=0.3"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5"]
